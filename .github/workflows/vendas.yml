# Roda o bot pelo GitHub Actions, de graça, sem Vercel.
#
# POR QUE ESTE ARQUIVO EXISTE: o plano Hobby da Vercel so aceita cron DIARIO --
# um "* * * * *" nem chega a publicar, ele falha no deploy. O Actions aceita ate
# de 5 em 5 minutos sem custo, e pra esta colecao (que passou 13 h sem uma
# transferencia) 5 minutos e de sobra.
#
# O agendamento do Actions atrasa quando a fila esta cheia. Nao ha problema: o
# bot le a faixa de blocos desde o ultimo que processou, entao um atraso so
# junta mais blocos na proxima passada.
name: vendas do ronkeverse

on:
  schedule:
    # De 15 em 15 min. Nao e pra rodar de 15 em 15: cada execucao dura ~50 min e
    # a `concurrency` abaixo poe a seguinte na FILA. Pedir mais vezes serve pra
    # garantir que sempre exista uma esperando quando a atual terminar.
    #
    # Com */30 as execucoes ficavam coladas mas nao emendadas: media de 3 a 20
    # minutos de buraco entre uma e outra (medido em 11/08/2026), e venda que
    # caisse no buraco esperava a proxima comecar. Foi o que fez a comunidade
    # achar que o bot tinha parado num dia em que ele estava certo.
    #
    # O GitHub mantem no maximo UM run pendente por grupo de concorrencia -- os
    # gatilhos extras substituem o pendente em vez de empilhar. Entao pedir mais
    # nao cria fila infinita.
    - cron: '*/15 * * * *'
  workflow_dispatch: # botao pra rodar na hora, util pra testar

# Duas execucoes ao mesmo tempo varreriam a mesma faixa e poderiam anunciar em
# dobro. A que chegar depois espera a anterior terminar -- e como cada uma dura
# ~50 min, a fila vira justamente a cobertura continua que a gente quer.
concurrency:
  group: vendas-do-ronkeverse
  cancel-in-progress: false

jobs:
  anunciar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # sinal de vida
      actions: write  # disparar a proxima execucao (ver o fim do arquivo)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # FICA VIVA ~50 MIN, checando de minuto em minuto. E o conserto do atraso:
      # em vez de depender de o GitHub disparar de 5 em 5 minutos (nao dispara),
      # uma execucao so cobre a hora inteira. Venda as 12:10 era anunciada 12:40;
      # com isso, sai em ate um minuto.
      #
      # O teto do job no Actions e 6 horas, entao 50 min tem folga de sobra, e
      # minuto em repositorio publico e ilimitado.
      - run: node rodar.js
        timeout-minutes: 55
        env:
          MINUTOS: '50'
          INTERVALO_S: '60'
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # Os nomes do Upstash. O KV da Vercel chama o MESMO par de
          # KV_REST_API_*, e o codigo aceita os dois -- mas o segredo tem que
          # chegar com o nome que existe aqui. Na primeira execucao eu passei
          # KV_REST_API_* enquanto os segredos estavam gravados como UPSTASH_*:
          # chegaram vazios, o bot caiu no modo ARQUIVO e teria repetido cada
          # venda de 5 em 5 minutos. Quem denunciou foi a linha "estado" do log.
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      # ------------------------------------------------------------------
      # SINAL DE VIDA -- sem isto o bot morre calado em 60 dias.
      #
      # O GitHub DESATIVA workflow agendado em repositorio publico depois de 60
      # dias sem commit. E so commit conta: abrir issue, criar tag ou fechar PR
      # nao resetam o relogio. O bot ficaria no ar, verde, sem nunca mais rodar
      # -- e o sintoma seria "parou de anunciar", tres semanas depois de parar.
      #
      # Uma linha de texto por mes basta pra manter o relogio zerado. Roda so na
      # virada do mes, entao sao 12 commits por ano.
      - name: sinal de vida (1x por mes)
        run: |
          mes=$(date -u +%Y-%m)
          if [ "$(cat .sinal 2>/dev/null)" != "$mes" ]; then
            echo "$mes" > .sinal
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .sinal
            git commit -m "sinal de vida $mes -- mantem o agendador ligado"
            git push
          fi

      # ------------------------------------------------------------------
      # A PROXIMA EXECUCAO E DISPARADA POR ESTA. Sem depender do cron.
      #
      # O cron do Actions e melhor-esforco de verdade: com "*/5" ele entregava
      # uma por hora, e com "*/15" passou UMA HORA E MEIA sem entregar nada
      # (11/08/2026, 00:31 -> 02:00). Nesse buraco duas vendas ficaram sem
      # anuncio ate alguem reclamar.
      #
      # Manter o bot vivo nao pode depender de um agendador que as vezes nao
      # agenda. Entao cada execucao termina chamando a proxima -- a corrente se
      # puxa sozinha, e o cron vira so a rede de seguranca pra o caso de um elo
      # arrebentar.
      #
      # `if: always()` porque a corrente NAO pode parar quando uma passada falha:
      # falha e justamente quando mais importa ter a proxima.
      - name: chama a proxima execucao
        if: always() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run vendas.yml --repo ${{ github.repository }}

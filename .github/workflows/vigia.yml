# ============================================================================
# VIGIA — grita quando o bot fica mudo
# ============================================================================
#
# POR QUE ESTE ARQUIVO EXISTE, e por que ele NAO e mais um agendador
#
# Em 27/08/2026 o bot passou 6h23 sem processar um bloco (na hora eu disse
# 9h35, calculando com 3s por bloco quando a Ronin faz 2s). Nada falhou: o
# workflow de vendas estava `active`, sem erro, Redis e RPC respondendo, suites
# verdes. Ele so nao foi EXECUTADO -- o cron do GitHub parou de entregar. Uma
# venda real (#2382, 351 RON) ficou sem anuncio, e a forma de descobrir foi
# alguem perguntar. O README ja registrava que isso tinha acontecido antes.
#
# Estudamos seis alternativas de hospedagem (cron-job.org, Cloudflare Cron
# Triggers, Deno Deploy, Supabase Cron, Oracle Always Free, GCP e2-micro). As
# SEIS foram reprovadas, e sempre pelo mesmo defeito: vigiam se o GATILHO
# disparou, nunca se o ANUNCIO saiu. Trocar de hospedagem sem resolver isso e
# trocar de silencio.
#
# Entao o vigia mede o RESULTADO: "o ponteiro andou?". E a unica pergunta que
# continua valendo depois de qualquer migracao -- inclusive a do webhook da
# Alchemy, que e pra onde este projeto vai.
#
# DE 30 EM 30 MINUTOS. Comecou de 3 em 3 horas, "pra nao herdar a cadencia do
# vigiado" -- mas isso confundiu duas coisas. O vigia nao pode herdar o
# MECANISMO do vigiado (por isso workflow separado, arquivo separado, sinal de
# vida proprio); a CADENCIA dele so precisa ser mais fina que o problema que
# ele deve enxergar. Com 3h, ele era incapaz de detectar qualquer coisa abaixo
# de 3h -- e uma das execucoes agendadas simplesmente nao rodou, o que levava o
# pior caso pra mais de 6h.
#
# NAO TEM AUTO-DISPARO, e agora o vendas.yml tambem nao tem. Um vigia que se
# auto-mantem tem o mesmo modo de falha do vigiado, e ai precisaria de um vigia
# do vigia. A corrente para aqui.
#
# DUAS CAMPAINHAS (ver o cabecalho do vigia.js):
#   1. Discord, se o secret DISCORD_WEBHOOK_ALERTA existir. Webhook SEPARADO --
#      "o bot esta mudo" no canal de vendas e ruido pra comunidade.
#   2. Saida != 0 sempre que houver atraso. O GitHub manda e-mail pro dono
#      quando um workflow agendado falha. Ou seja: o alarme funciona NO MINUTO
#      em que este arquivo for commitado, sem configurar secret nenhum.
name: vigia do bot de vendas

on:
  schedule:
    # DE 30 EM 30 MINUTOS, nao de 3 em 3 horas. Regra que faltava: um vigia
    # que dorme 3h e incapaz de detectar qualquer coisa abaixo de 3h -- e com
    # o atraso do proprio cron do GitHub o pior caso passava de 6h. Custa ~48
    # execucoes/dia de 2 chamadas de Redis: ruido contra os 500 mil/mes.
    # Minutos deslocados de :00 pelo mesmo motivo do vendas.yml.
    - cron: '13,43 * * * *'
  workflow_dispatch:

# Duas checagens ao mesmo tempo nao fazem mal, mas tambem nao servem pra nada.
concurrency:
  group: vigia-do-ronkeverse
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    # PRA COMMITAR O PROPRIO SINAL DE VIDA -- ver o ultimo passo deste arquivo.
    permissions:
      contents: write
    # Um alarme que trava vira outro silencio. 5 min e folga enorme: o ciclo
    # ocioso medido leva ~1s, e o vigia faz menos que um ciclo.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Sem `npm ci`: o projeto nao tem dependencia nenhuma, de proposito.
      - name: conferir se o bot esta em dia
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # Opcional. Sem ele o alarme sai so pelo e-mail de workflow falho.
          DISCORD_WEBHOOK_ALERTA: ${{ secrets.DISCORD_WEBHOOK_ALERTA }}
          # NAO BAIXE PARA 15. O comentario aqui mandava fazer isso depois da
          # migracao pro webhook, e estava ERRADO -- corrigido antes que a
          # proxima sessao refizesse o engano.
          #
          # Duas razoes. (1) O webhook NAO DISPARA em periodo sem venda: esta
          # colecao ja passou 13h sem uma transferencia, e nesse tempo quem
          # segura o ponteiro perto da cabeca e a rede do Actions, de 15 em 15
          # minutos. (2) Regra geral: o limiar tem que ser >= a cadencia do
          # OBSERVADOR. Com o vigia acordando de 30 em 30 min, 60 e defensavel;
          # 20 dispararia alarme falso com o sistema perfeitamente saudavel --
          # e alarme falso e como alarme deixa de ser lido.
          VIGIA_LIMITE_MIN: '60'
        run: node vigia.js

      # ------------------------------------------------------------------
      # O VIGIA NAO PODE DEPENDER DA SAUDE DO VIGIADO -- e dependia.
      #
      # O GitHub desativa workflow agendado depois de 60 dias sem commit no
      # repositorio. Ate aqui o UNICO commit mensal morava dentro do
      # vendas.yml. Ou seja: se o bot adoecesse, o commit parava junto, e 60
      # dias depois os DOIS workflows morriam no mesmo instante -- sem exit 1 e
      # sem e-mail, porque workflow desativado nao falha: ele so nao roda.
      #
      # O vigia seria incapaz de avisar da propria morte, que e exatamente o
      # modo de falha que ele existe pra impedir.
      #
      # Arquivo PROPRIO (.sinal-vigia), pra que este passo nao dependa do
      # estado do .sinal do outro workflow. `if: always()` pelo mesmo motivo do
      # vendas.yml: quando o vigia GRITA ele sai com codigo 1, e sem o always()
      # o sinal de vida seria pulado justamente nos meses em que houve
      # problema.
      # ------------------------------------------------------------------
      - name: sinal de vida do vigia (1x por mes)
        if: always()
        run: |
          mes=$(date -u +%Y-%m)
          if [ "$(cat .sinal-vigia 2>/dev/null)" != "$mes" ]; then
            echo "$mes" > .sinal-vigia
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .sinal-vigia
            git commit -m "sinal de vida do vigia $mes"
            # `origin main` EXPLICITO: o actions/checkout clona RASO, e um
            # `git pull --rebase` pelado responde "up to date" sem enxergar o
            # commit que o outro workflow acabou de empurrar.
            # E `|| echo ::warning`: os dois workflows commitam em main agora,
            # entao corrida existe. Ela e transitoria e se cura sozinha -- o
            # arquivo continua com o mes velho, e a proxima volta tenta de novo.
            # Derrubar a execucao por isso seria e-mail de alarme por um
            # problema que ja passou.
            git pull --rebase --autostash origin main && git push || echo "::warning::sinal de vida nao subiu (corrida); a proxima volta tenta"
          fi
